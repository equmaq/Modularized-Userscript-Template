<form method="dialog" class="modular-userscript">
  <div class="modular-userscript-body">
    <header class="modular-userscript-header">
      <p class="modular-userscript-intro">{{INTRO}}</p>
      <h2>Modular Userscript</h2>
      <p>Choose which modules should be active. Changes are saved immediately and applied upon reload.</p>
    </header>
    {{SECTIONS}}
  </div>
  <footer class="modular-userscript-footer">
    <small>Open this menu again from the userscript manager menu.</small>
    <button type="submit" value="apply" class="button--primary button">Apply</button>
  </footer>
</form>
